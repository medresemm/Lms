                $ref: "#/components/schemas/AdminUser"
components:
  schemas:
    ResolveStudentNumberInput:
      type: object
      required: [identifier]
      properties:
        identifier: { type: string }
    ResolveStudentNumberResult:
      type: object
      required: [email]
      properties:
        email: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Course:
      type: object
      required: [id, title, category, instructor, progress, completedLessons, totalLessons, color, credits, hours, lessonDays, lessonTime]
      properties:
        id: { type: number }
        title: { type: string }
        category: { type: string }
        instructor: { type: string }
        progress: { type: number, minimum: 0, maximum: 100 }
        completedLessons: { type: number, minimum: 0 }
        totalLessons: { type: number, minimum: 0 }
        color: { type: string }
        credits: { type: number, minimum: 0 }
        hours: { type: number, minimum: 0 }
        lessonDays:
          type: array
          items: { type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday] }
        lessonTime: { type: ["string", "null"], pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9]$" }
        nextLesson: { type: ["string", "null"] }
        pdfUrl: { type: ["string", "null"] }
        telegramUrl: { type: ["string", "null"] }
        zoomUrl: { type: ["string", "null"] }
        googleMeetUrl: { type: ["string", "null"] }
        lessonUrl: { type: ["string", "null"] }
    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/Course"
        - type: object
          required: [description, curriculum, lessonDescription, resources]
          properties:
            description: { type: string }
            curriculum:
              type: array
              items: { type: string }
            lessonDescription: { type: string }
            resources:
              type: array
              items:
                $ref: "#/components/schemas/LearningResource"
    LearningResource:
      type: object
      required: [id, courseId, termNumber, kind, title, body, url, expiresAt, lessonDays, lessonTime, isMandatory, teacherClerkUserId, teacherName, studentCapacity]
      properties:
        id: { type: number }
        courseId: { type: number }
        termNumber: { type: number, minimum: 1, maximum: 8 }
        kind: { type: string, enum: [material, text, pdf, telegram] }
        title: { type: string }
        body: { type: string }
        url: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"], format: date-time }
        lessonDays:
          type: array
          items: { type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday] }
        lessonTime: { type: ["string", "null"] }
        isMandatory: { type: boolean }
        teacherClerkUserId: { type: ["string", "null"] }
        teacherName: { type: ["string", "null"] }
        studentCapacity: { type: number, minimum: 0 }
    AssignmentAttachment:
      type: object
      required: [id, originalName, contentType, size, kind, downloadUrl]
      properties:
        id: { type: number }
        originalName: { type: string }
        contentType: { type: string }
        size: { type: number, minimum: 1 }
        kind: { type: string, enum: [assignment, submission] }
        downloadUrl: { type: string }
    AssignmentSubmission:
      type: object
      required: [id, assignmentId, profileId, answerText, status, submittedAt, score, feedback, reviewedAt, attachments]
      properties:
        id: { type: number }
        assignmentId: { type: number }
        profileId: { type: number }
        answerText: { type: string }
        status: { type: string, enum: [submitted, graded, resubmission_requested] }
        submittedAt: { type: string, format: date-time }
        score: { type: ["number", "null"], minimum: 0 }
        feedback: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AssignmentAttachment" }
    Assignment:
      type: object
      required: [id, courseId, resourceId, termNumber, courseTitle, teacherName, title, description, dueAt, maxScore, status, attachments, submission]
      properties:
        id: { type: number }
        courseId: { type: number }
        resourceId: { type: number }
        termNumber: { type: number, minimum: 1, maximum: 8 }
        courseTitle: { type: string }
        teacherName: { type: string }
        title: { type: string }
        description: { type: string }
        dueAt: { type: string, format: date-time }
        maxScore: { type: number, minimum: 1 }
        status: { type: string, enum: [open, closed] }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/AssignmentAttachment" }
        submission:
          oneOf:
            - $ref: "#/components/schemas/AssignmentSubmission"
            - type: "null"
    AssignmentInput:
      type: object
      required: [courseId, resourceId, termNumber, title, description, dueAt, maxScore]
      properties:
        courseId: { type: number, minimum: 1 }
        resourceId: { type: number, minimum: 1 }
        termNumber: { type: number, minimum: 1, maximum: 8 }
        teacherClerkUserId: { type: string }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 12000 }
        dueAt: { type: string, format: date-time }
        maxScore: { type: number, minimum: 1, maximum: 1000 }
        attachmentIntentIds:
          type: array
          maxItems: 5
          items: { type: number, minimum: 1 }
    AssignmentUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 12000 }
        dueAt: { type: string, format: date-time }
        maxScore: { type: number, minimum: 1, maximum: 1000 }
        status: { type: string, enum: [open, closed] }
        attachmentIntentIds:
          type: array
          maxItems: 5
          items: { type: number, minimum: 1 }
    AssignmentUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: number, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [application/pdf, application/msword, application/vnd.openxmlformats-officedocument.wordprocessingml.document, image/png, image/jpeg, text/plain] }
    AssignmentSubmissionInput:
      type: object
      required: [answerText]
      properties:
        answerText: { type: string, maxLength: 12000 }
        attachmentIntentIds:
          type: array
          maxItems: 5
          items: { type: number, minimum: 1 }
    AssignmentGradeInput:
      type: object
      required: [score, feedback]
      properties:
        score: { type: number, minimum: 0, maximum: 1000 }
        feedback: { type: string, maxLength: 5000 }
    AssignmentFeedbackInput:
      type: object
      required: [feedback]
      properties:
        feedback: { type: string, minLength: 1, maxLength: 5000 }
    AdminAssignment:
      allOf:
        - $ref: "#/components/schemas/Assignment"
        - type: object
          required: [teacherClerkUserId, submissionCount, gradedCount]
          properties:
            teacherClerkUserId: { type: string }
            submissionCount: { type: number, minimum: 0 }
            gradedCount: { type: number, minimum: 0 }
    AdminAssignmentSubmission:
      allOf:
        - $ref: "#/components/schemas/AssignmentSubmission"
        - type: object
          required: [studentName, studentNumber, email]
          properties:
            studentName: { type: string }
            studentNumber: { type: number }
            email: { type: string }
    ExamOption:
      type: object
      required: [id, label, position]
      properties:
        id: { type: number }
        label: { type: string }
        position: { type: number, minimum: 0 }
    ExamQuestion:
      type: object
      required: [id, prompt, position, options]
      properties:
        id: { type: number }
        prompt: { type: string }
        position: { type: number, minimum: 0 }
        options:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/ExamOption" }
    ExamResult:
      type: object
      required: [correctCount, totalQuestions, percentage]
      properties:
        correctCount: { type: number, minimum: 0 }
        totalQuestions: { type: number, minimum: 0 }
        percentage: { type: number, minimum: 0, maximum: 100 }
    ExamSubmission:
      type: object
      required: [id, examId, profileId, answers, submittedAt, result]
      properties:
        id: { type: number }
        examId: { type: number }
        profileId: { type: number }
        answers:
          type: object
          additionalProperties: { type: number }
        submittedAt: { type: string, format: date-time }
        result:
          $ref: "#/components/schemas/ExamResult"
    Exam:
      type: object
      required: [id, courseId, resourceId, termNumber, courseTitle, teacherName, title, description, status, isOnboarding, durationMinutes, startedAt, createdAt, updatedAt, questions, submission]
      properties:
        id: { type: number }
        courseId: { type: number }
        resourceId: { type: number }
        termNumber: { type: number, minimum: 1, maximum: 8 }
        courseTitle: { type: string }
        teacherName: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [open, closed] }
        isOnboarding: { type: boolean }
        durationMinutes:
          oneOf:
            - { type: number, minimum: 1, maximum: 240 }
            - { type: "null" }
        startedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        questions:
          type: array
          items: { $ref: "#/components/schemas/ExamQuestion" }
        submission:
          oneOf:
            - $ref: "#/components/schemas/ExamSubmission"
            - type: "null"
    ExamQuestionInput:
      type: object
      required: [prompt, options, correctOptionIndex]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 2000 }
        options:
          type: array
          minItems: 2
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 500 }
        correctOptionIndex: { type: number, minimum: 0, maximum: 7 }
    ExamInput:
      type: object
      required: [title, description, questions]
      properties:
        resourceId: { type: number, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 12000 }
        status: { type: string, enum: [open, closed] }
        isOnboarding: { type: boolean }
        durationMinutes:
          oneOf:
            - { type: number, minimum: 1, maximum: 240 }
            - { type: "null" }
        questions:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/ExamQuestionInput" }
    ExamUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 12000 }
        status: { type: string, enum: [open, closed] }
        isOnboarding: { type: boolean }
        durationMinutes:
          oneOf:
            - { type: number, minimum: 1, maximum: 240 }
            - { type: "null" }
        questions:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/ExamQuestionInput" }
    ExamSubmissionInput:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties: { type: number, minimum: 1 }
    AdminExam:
      allOf:
        - $ref: "#/components/schemas/Exam"
        - type: object
          required: [teacherClerkUserId, submissionCount, questions]
          properties:
            teacherClerkUserId: { type: string }
            submissionCount: { type: number, minimum: 0 }
            questions:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/ExamQuestion"
                  - type: object
                    required: [correctOptionId]
                    properties:
                      correctOptionId:
                        oneOf:
                          - { type: number, minimum: 1 }
                          - { type: "null" }
    AdminExamSubmission:
      allOf:
        - $ref: "#/components/schemas/ExamSubmission"
        - type: object
          required: [studentName, studentNumber, email, answerLabels, reviewStatus]
          properties:
            studentName: { type: string }
            studentNumber: { type: number }
            email: { type: string }
            reviewStatus: { type: string, enum: [pending, approved] }
            answerLabels:
              type: object
              additionalProperties: { type: string }
    ExamResendResult:
      type: object
      required: [examId, profileId, resent]
      properties:
        examId: { type: number }
        profileId: { type: number }
        resent: { type: boolean }
    ExamReviewResult:
      type: object
      required: [examId, profileId, reviewStatus]
      properties:
        examId: { type: number }
        profileId: { type: number }
        reviewStatus: { type: string, enum: [approved] }
    TeacherOption:
      type: object
      required: [clerkUserId, firstName, lastName, displayName]
      properties:
        clerkUserId: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        displayName: { type: string }
    SubjectRemovalRequest:
      type: object
      required: [id, profileId, courseId, termNumber, courseTitle, studentName, reason, status, rejectionReason, createdAt, reviewedAt]
      properties:
        id: { type: number }
        profileId: { type: number }
        courseId: { type: number }
        termNumber: { type: number, minimum: 1, maximum: 8 }
        courseTitle: { type: string }
        studentName: { type: string }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        rejectionReason: { type: ["string", "null"], maxLength: 1000 }
        createdAt: { type: string }
        reviewedAt: { type: ["string", "null"] }
    SubjectRemovalRequestInput:
      type: object
      required: [courseId, termNumber, reason]
      properties:
        courseId: { type: number }
        termNumber: { type: number, minimum: 1, maximum: 8 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    SubjectRemovalDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        rejectionReason: { type: ["string", "null"], maxLength: 1000 }
    Announcement:
      type: object
      required: [id, title, body, date, type]
      properties:
        id: { type: number }
        title: { type: string }
        body: { type: string }
        date: { type: string }
        type: { type: string, enum: [important, info, event, lesson, book, announcement, news, admission] }
    Article:
      type: object
      required: [id, title, excerpt, body, author, createdAt]
      properties:
        id: { type: number }
        title: { type: string }
        excerpt: { type: string }
        body: { type: string }
        author: { type: string }
        createdAt: { type: string }
    DailyBenefit:
      type: object
      required: [id, body, source, dayOfWeek, createdAt]
      properties:
        id: { type: number }
        body: { type: string }
        source: { type: string }
        dayOfWeek: { type: string, enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday] }
        createdAt: { type: string }
    Dashboard:
      type: object
      required: [studentName, greeting, courses, announcements, nextLesson]
      properties:
        studentName: { type: string }
        greeting: { type: string }
        courses:
          type: array
          items:
            $ref: "#/components/schemas/Course"
        announcements:
          type: array
          items:
            $ref: "#/components/schemas/Announcement"
        nextLesson:
          type: ["string", "null"]
    CourseInput:
      type: object
      required: [title, category, instructor, color, credits, hours, description, lessonDescription, lessonDays, lessonTime]
      properties:
        title: { type: string }
        category: { type: string }
        instructor: { type: string }
        progress: { type: number, minimum: 0, maximum: 100 }
        completedLessons: { type: number, minimum: 0 }
        totalLessons: { type: number, minimum: 0 }
        color: { type: string }
        credits: { type: number, minimum: 0 }
        hours: { type: number, minimum: 0 }
        nextLesson: { type: ["string", "null"] }
        pdfUrl: { type: ["string", "null"] }
        telegramUrl: { type: ["string", "null"] }
        zoomUrl: { type: ["string", "null"] }
        googleMeetUrl: { type: ["string", "null"] }
        lessonUrl: { type: ["string", "null"] }
        description: { type: string }
        curriculum:
          type: array
          items: { type: string }
        lessonDescription: { type: string }
        lessonDays:
          type: array
