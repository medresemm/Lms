openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lms
    description: Learning management operations
  - name: applications
    description: Student application operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [lms]
      summary: Get student dashboard
      responses:
        "200":
          description: Student dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /auth/resolve-student-number:
    post:
      operationId: resolveStudentNumber
      tags: [lms]
      summary: Resolve a student number to the student's email address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveStudentNumberInput"
      responses:
        "200":
          description: Student email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveStudentNumberResult"
  /student/deletion-notice:
    get:
      operationId: getStudentDeletionNotice
      tags: [applications]
      summary: Get the current student's account deletion notice
      responses:
        "200":
          description: Deletion notice, or null when the account is active
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/StudentDeletionNotice"
                  - type: "null"
  /courses:
    get:
      operationId: getCourses
      tags: [lms]
      summary: Get active courses
      responses:
        "200":
          description: Active courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /courses/{courseId}:
    get:
      operationId: getCourse
      tags: [lms]
      summary: Get course details
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Course details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Course not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                required: [error]
  /courses/{courseId}/pdf:
    get:
      operationId: getCoursePdf
      tags: [lms]
      summary: Download or view a course PDF
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Course PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /resources/{resourceId}/file:
    get:
      operationId: getResourceFile
      tags: [lms]
      summary: Download or view a learning resource PDF
      parameters:
        - name: resourceId
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Learning resource PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /announcements:
    get:
      operationId: getAnnouncements
      tags: [lms]
      summary: Get academy announcements
      responses:
        "200":
          description: Recent announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
  /articles:
    get:
      operationId: getArticles
      tags: [lms]
      summary: Get public academy articles
      responses:
        "200":
          description: Academy articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
  /daily-benefit:
    get:
      operationId: getDailyBenefit
      tags: [lms]
      summary: Get the current daily benefit
      responses:
        "200":
          description: Current daily benefit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyBenefit"
  /resources:
    get:
      operationId: getResources
      tags: [lms]
      summary: Get learning resources for a semester
      parameters:
        - name: termNumber
          in: query
          required: true
          schema: { type: number, minimum: 1, maximum: 8 }
      responses:
        "200":
          description: Learning resources for the selected semester
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningResource"
  /assignments:
    get:
      operationId: getStudentAssignments
      tags: [lms]
      summary: List assignments available to the signed-in student
      parameters:
        - { name: termNumber, in: query, required: true, schema: { type: number, minimum: 1, maximum: 8 } }
      responses:
        "200":
          description: Student assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Assignment" }
  /assignments/{assignmentId}:
    get:
      operationId: getStudentAssignment
      tags: [lms]
      summary: Get an assignment and the student's own submission
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Assignment details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assignment" }
  /assignments/{assignmentId}/submission-upload-url:
    post:
      operationId: requestStudentAssignmentUploadUrl
      tags: [lms]
      summary: Request a private upload URL for a student submission attachment
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentUploadInput" }
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
  /assignments/{assignmentId}/submissions:
    post:
      operationId: submitAssignment
      tags: [lms]
      summary: Submit or resubmit an assignment
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentSubmissionInput" }
      responses:
        "200":
          description: Saved assignment submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentSubmission" }
  /admin/assignment-upload-url:
    post:
      operationId: requestAdminAssignmentUploadUrl
      tags: [lms]
      summary: Request a private upload URL for an assignment attachment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentUploadInput" }
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
  /admin/assignments:
    get:
      operationId: getAdminAssignments
      tags: [lms]
      summary: List assignments managed by the signed-in teacher
      parameters:
        - { name: termNumber, in: query, required: false, schema: { type: number, minimum: 1, maximum: 8 } }
      responses:
        "200":
          description: Teacher assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminAssignment" }
    post:
      operationId: createAssignment
      tags: [lms]
      summary: Create an assignment for a teacher group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentInput" }
      responses:
        "201":
          description: Created assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAssignment" }
  /admin/assignments/{assignmentId}:
    patch:
      operationId: updateAssignment
      tags: [lms]
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentUpdate" }
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAssignment" }
  /admin/assignments/{assignmentId}/submissions:
    get:
      operationId: getAssignmentSubmissions
      tags: [lms]
      summary: List submissions for a teacher's assignment
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Assignment submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminAssignmentSubmission" }
  /admin/assignments/{assignmentId}/submissions/{submissionId}/grade:
    post:
      operationId: gradeAssignmentSubmission
      tags: [lms]
      summary: Grade an assignment submission
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: number } }
        - { name: submissionId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentGradeInput" }
      responses:
        "200":
          description: Graded submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentSubmission" }
  /admin/assignments/{assignmentId}/submissions/{submissionId}/request-resubmission:
    post:
      operationId: requestAssignmentResubmission
      tags: [lms]
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: number } }
        - { name: submissionId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentFeedbackInput" }
      responses:
        "200":
          description: Resubmission requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentSubmission" }
  /exams:
    get:
      operationId: getStudentExams
      tags: [lms]
      summary: List open tests available to the signed-in student
      parameters:
        - { name: termNumber, in: query, required: true, schema: { type: number, minimum: 1, maximum: 8 } }
      responses:
        "200":
          description: Student tests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Exam" }
  /exams/{examId}:
    get:
      operationId: getStudentExam
      tags: [lms]
      summary: Get a test and the student's own submission
      parameters:
        - { name: examId, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Test details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exam" }
  /exams/{examId}/submissions:
    post:
      operationId: submitExam
      tags: [lms]
      summary: Submit answers for a test
      parameters:
        - { name: examId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExamSubmissionInput" }
      responses:
        "201":
          description: Saved test submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamSubmission" }
  /admin/exams:
    get:
      operationId: getAdminExams
      tags: [lms]
      summary: List tests managed by the signed-in teacher
      responses:
        "200":
          description: Teacher tests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminExam" }
    post:
      operationId: createExam
      tags: [lms]
      summary: Create a test for a teacher group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExamInput" }
      responses:
        "201":
          description: Created test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminExam" }
  /admin/exams/{examId}:
    patch:
      operationId: updateExam
      tags: [lms]
      summary: Update a teacher test
      parameters:
        - { name: examId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExamUpdate" }
      responses:
        "200":
          description: Updated test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminExam" }
    delete:
      operationId: deleteExam
      tags: [lms]
      summary: Delete a teacher test and its related submissions
      parameters:
        - { name: examId, in: path, required: true, schema: { type: number } }
      responses:
        "204":
          description: Test deleted
  /admin/exams/{examId}/submissions:
    get:
      operationId: getExamSubmissions
      tags: [lms]
      summary: List submissions for a teacher test
      parameters:
        - { name: examId, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Test submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminExamSubmission" }
  /admin/exams/{examId}/submissions/{profileId}/resend:
    post:
      operationId: resendExamToStudent
      tags: [lms]
      summary: Reset a student's test attempt so the teacher can resend it
      parameters:
        - { name: examId, in: path, required: true, schema: { type: number } }
        - { name: profileId, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Reset test attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamResendResult" }
  /admin/exams/{examId}/submissions/{profileId}/approve:
    post:
      operationId: approveExamSubmission
      tags: [lms]
      summary: Approve a student's onboarding test
      parameters:
        - { name: examId, in: path, required: true, schema: { type: number } }
        - { name: profileId, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Approved test submission
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExamReviewResult" }
  /assignment-attachments/{attachmentId}:
    get:
      operationId: getAssignmentAttachment
      tags: [lms]
      summary: Stream an authorized assignment attachment
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Assignment attachment
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /student/lesson-joins:
    post:
      operationId: recordLessonJoin
      tags: [lms]
      summary: Record a server-timestamped join to today's scheduled live lesson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonJoinInput" }
      responses:
        "201":
          description: Recorded (or existing idempotent) join event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonJoinEvent" }
  /admin/lesson-attendance:
    get:
      operationId: getAdminLessonAttendance
      tags: [lms]
      summary: List live lesson joins and final attendance decisions
      responses:
        "200":
          description: Lesson attendance
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LessonAttendance" }
  /admin/lesson-attendance/{eventId}:
    patch:
      operationId: confirmLessonAttendance
      tags: [lms]
      summary: Confirm final attendance for a lesson join
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LessonAttendanceDecisionInput" }
      responses:
        "200":
          description: Confirmed attendance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LessonAttendance" }
  /semester-subject-removal-requests:
    get:
      operationId: getStudentSubjectRemovalRequests
      tags: [lms]
      responses:
        "200":
          description: Student subject removal requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SubjectRemovalRequest" }
    post:
      operationId: createStudentSubjectRemovalRequest
      tags: [lms]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubjectRemovalRequestInput" }
      responses:
        "201":
          description: Subject removal request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubjectRemovalRequest" }
  /semester-subjects/{courseId}/{termNumber}:
    delete:
      operationId: removeOptionalStudentSubject
      tags: [lms]
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: number }
        - name: termNumber
          in: path
          required: true
          schema: { type: number, minimum: 1, maximum: 8 }
      responses:
        "204": { description: Subject removed }
  /profile:
    get:
      operationId: getStudentAcademicProfile
      tags: [lms]
      summary: Get the signed-in student's academic profile and grades
      responses:
        "200":
          description: Student academic profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicProfile"
  /account/profile:
    get:
      operationId: getOwnUserProfile
      tags: [lms]
      summary: Get the signed-in user's editable profile
      responses:
        "200":
          description: Editable profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserProfile"
    patch:
      operationId: updateOwnUserProfile
      tags: [lms]
      summary: Update the signed-in user's editable profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserProfileInput"
      responses:
        "200":
          description: Updated editable profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserProfile"
  /admin/courses:
    post:
      operationId: createCourse
      tags: [lms]
      summary: Create a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: Created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
  /admin/courses/upload-url:
    post:
      operationId: requestCourseUploadUrl
      tags: [lms]
      summary: Request a secure upload URL for a course PDF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseUploadUrlResponse"
  /admin/announcements:
    get:
      operationId: getAdminAnnouncements
      tags: [lms]
      summary: List academy announcements
      responses:
        "200":
          description: Academy announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [lms]
      summary: Create an announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
  /admin/announcements/{announcementId}:
    patch:
      operationId: updateAnnouncementById
      tags: [lms]
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "200":
          description: Updated announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    delete:
      operationId: deleteAnnouncement
      tags: [lms]
      parameters:
        - name: announcementId
          in: path
          required: true
          schema: { type: number }
      responses:
        "204": { description: Announcement deleted }
  /admin/articles:
    get:
      operationId: getAdminArticles
      tags: [lms]
      summary: List academy articles for teachers
      responses:
        "200":
          description: Academy articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"
    post:
      operationId: createArticle
      tags: [lms]
      summary: Publish an academy article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Published article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
  /admin/articles/{articleId}:
    patch:
      operationId: updateArticle
      tags: [lms]
      parameters:
        - name: articleId
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "200":
          description: Updated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
    delete:
      operationId: deleteArticle
      tags: [lms]
      parameters:
        - name: articleId
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Article deleted
  /admin/daily-benefits:
    get:
      operationId: getAdminDailyBenefits
      tags: [lms]
      summary: List daily benefits for teachers
      responses:
        "200":
          description: Daily benefits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyBenefit"
    post:
      operationId: createDailyBenefit
      tags: [lms]
      summary: Publish a daily benefit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyBenefitInput"
      responses:
        "201":
          description: Published daily benefit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyBenefit"
  /admin/daily-benefits/{dayOfWeek}:
    delete:
      operationId: deleteAdminDailyBenefit
      tags: [daily-benefits]
      summary: Clear a weekday's daily benefit
      parameters:
        - name: dayOfWeek
          in: path
          required: true
          schema:
            type: string
            enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
      responses:
        "204":
          description: Daily benefit cleared
  /admin/selected-courses:
    get:
      operationId: getAdminSelectedCourses
      tags: [lms]
      summary: List courses selected for a semester
      parameters:
        - name: termNumber
          in: query
          required: true
          schema: { type: number, minimum: 1, maximum: 8 }
      responses:
        "200":
          description: Courses selected for the semester
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /admin/resources:
    get:
      operationId: getAdminResources
      tags: [lms]
      summary: List learning resources
      responses:
        "200":
          description: Learning resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningResource"
    post:
      operationId: createResource
      tags: [lms]
      summary: Create a learning resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "201":
          description: Created learning resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningResource"
  /admin/resources/{resourceId}:
    patch:
      operationId: updateResource
      tags: [lms]
      parameters:
